<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>twillful</title>
  <meta
    name="description"
    content="Twillful is a creative marketing studio focused on content creation and website design for brands that want sharper digital presence."
  />
  <meta name="theme-color" content="#95b475" />
  <link rel="icon" type="image/png" href="assets/twillful-favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Beth+Ellen&family=Manrope:wght@400;500;600;700;800&family=Syne:wght@500;700;800&display=swap"
    rel="stylesheet"
  />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: "#95b475",
            brandBright: "#bfd4a7",
            brandDeep: "#3f5a2c",
            mist: "#eef5e8",
            ink: "#142012",
            olive: "#61774d"
          },
          fontFamily: {
            sans: ["Manrope", "sans-serif"],
            display: ["Canva Sans", "Manrope", "sans-serif"],
            accent: ["Syne", "sans-serif"]
          },
          boxShadow: {
            glow: "0 35px 80px rgba(176, 255, 211, 0.22)",
            soft: "0 28px 80px rgba(20, 32, 18, 0.15)"
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --brand: #95b475;
      --brand-bright: #bfd4a7;
      --brand-deep: #3f5a2c;
      --mist: #eef5e8;
      --ink: #142012;
      --olive: #61774d;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--mist);
      font-family: "Manrope", sans-serif;
      background:
        radial-gradient(circle at 50% 46%, rgba(234, 244, 217, 0.5), rgba(234, 244, 217, 0.03) 22%, rgba(0, 0, 0, 0) 44%),
        radial-gradient(circle at top center, rgba(223, 237, 207, 0.18), transparent 28%),
        linear-gradient(135deg, #6f9360 0%, #88aa6f 34%, #95b475 58%, #779866 100%);
      min-height: 100vh;
    }

    .hero-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 48% 46%, rgba(255, 255, 255, 0.2), transparent 20%),
        radial-gradient(circle at 72% 36%, rgba(235, 245, 223, 0.14), transparent 26%);
      pointer-events: none;
      opacity: 0.98;
      animation: hero-ambient 12s ease-in-out infinite;
    }

    .hero-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .hero-noise {
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: 3rem 3rem;
      mask-image: radial-gradient(circle at center, black, transparent 78%);
      opacity: 0.18;
    }

    .section-panel {
      position: relative;
      overflow: hidden;
    }

    .section-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: inherit;
      pointer-events: none;
    }

    @keyframes float-arrow {
      0%,
      100% {
        transform: translateY(0);
        opacity: 0.72;
      }
      50% {
        transform: translateY(8px);
        opacity: 1;
      }
    }

    .scroll-arrow {
      animation: float-arrow 2.6s ease-in-out infinite;
    }

    @keyframes hero-ambient {
      0%,
      100% {
        transform: translate3d(0, 0, 0) scale(1);
      }
      50% {
        transform: translate3d(-1.4%, 0.8%, 0) scale(1.03);
      }
    }

    .mockup-stage {
      transform: translateY(0);
    }

    @keyframes decor-float-a {
      0%,
      100% {
        transform: translateY(0) rotate(-2deg);
        opacity: 0.68;
      }
      50% {
        transform: translateY(-8px) rotate(1deg);
        opacity: 0.95;
      }
    }

    @keyframes decor-float-b {
      0%,
      100% {
        transform: translateY(0) rotate(1deg);
        opacity: 0.55;
      }
      50% {
        transform: translateY(6px) rotate(-2deg);
        opacity: 0.86;
      }
    }

    @keyframes decor-float-c {
      0%,
      100% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.62;
      }
      50% {
        transform: translateY(-5px) rotate(3deg);
        opacity: 0.9;
      }
    }

    .hero-decor {
      pointer-events: none;
      user-select: none;
    }

    .decor-a {
      animation: none;
    }

    .decor-b {
      animation: none;
    }

    .decor-c {
      animation: decor-float-c 6.6s ease-in-out infinite;
    }

    .desktop-screen {
      position: absolute;
      left: 50%;
      top: calc(16.2% - 9px);
      width: min(595px, 89%);
      height: min(325px, 50.2%);
      transform: translateX(-50%);
      overflow: hidden;
      border-radius: 0.15rem;
      background: #000;
    }

    .desktop-scroll-track {
      position: absolute;
      inset: -12px;
    }

    .desktop-iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 1440px;
      height: 900px;
      transform: translate(-9px, 12px) scale(0.427);
      transform-origin: top left;
      border: 0;
      pointer-events: none;
    }

    .phone-screen {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 151px;
      height: 328px;
      transform: translate(-50%, -50%);
      overflow: hidden;
      border-radius: 24px;
      background: #000;
    }

    .phone-video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 150%;
      height: 150%;
      transform: translate(-50%, -50%);
      transform-origin: center;
      border: 0;
      pointer-events: none;
    }

    .saas-hero-shell {
      position: relative;
      min-height: 100svh;
      background: #ffffff;
      color: #151515;
      overflow: hidden;
    }

    .saas-hero-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 18%, rgba(149, 180, 117, 0.06), transparent 18%),
        radial-gradient(circle at 80% 72%, rgba(112, 132, 255, 0.04), transparent 20%);
      pointer-events: none;
    }

    .saas-stage {
      position: relative;
      width: min(1240px, calc(100vw - 48px));
      min-height: min(860px, calc(100svh - 32px));
      margin: 0 auto;
      overflow: hidden;
    }

    .saas-stage::before,
    .saas-stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .saas-stage::before {
      background:
        radial-gradient(circle at center, rgba(149, 180, 117, 0.04), transparent 28%);
      opacity: 1;
    }

    .saas-stage::after {
      background:
        linear-gradient(120deg, transparent 0%, rgba(149, 180, 117, 0.06) 45%, transparent 55%);
      transform: translateX(-120%);
      animation: stage-sheen 9s ease-in-out infinite 2.4s;
      opacity: 0.35;
    }

    .hero-copy {
      opacity: 0;
      transform: translateY(22px);
      animation: copy-rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.72s;
    }

    .hero-subcopy,
    .hero-actions {
      opacity: 0;
      transform: translateY(16px);
      animation: copy-rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards 2.05s;
    }

    .hero-actions {
      animation-delay: 2.2s;
    }

    .hero-card {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 184px;
      aspect-ratio: 1 / 1;
      border-radius: 28px;
      overflow: visible;
      box-shadow:
        0 30px 70px rgba(18, 25, 18, 0.14),
        inset 0 0 0 1px rgba(255, 255, 255, 0.32);
      opacity: 0;
      transform-origin: center center;
    }

    .hero-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(155deg, rgba(255, 255, 255, 0.56), transparent 30%),
        radial-gradient(circle at 78% 18%, rgba(255, 255, 255, 0.28), transparent 20%);
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .hero-card--lead {
      z-index: 6;
      animation: lead-card-rise 0.95s cubic-bezier(0.2, 0.95, 0.22, 1) forwards 0.18s;
    }

    .hero-card--a {
      z-index: 2;
      animation: fan-card-left-a 1.02s cubic-bezier(0.19, 0.9, 0.22, 1) forwards 1.22s;
    }

    .hero-card--b {
      z-index: 3;
      animation: fan-card-left-b 1.04s cubic-bezier(0.19, 0.9, 0.22, 1) forwards 1.28s;
    }

    .hero-card--c {
      z-index: 4;
      animation: fan-card-left-c 1.06s cubic-bezier(0.19, 0.9, 0.22, 1) forwards 1.34s;
    }

    .hero-card--d {
      z-index: 5;
      animation: fan-card-left-d 1.08s cubic-bezier(0.19, 0.9, 0.22, 1) forwards 1.4s;
    }

    .hero-card-art {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      overflow: hidden;
    }

    .hero-card-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-card-grid,
    .hero-card-circle,
    .hero-card-line {
      position: absolute;
      pointer-events: none;
    }

    .hero-card-grid {
      inset: 10% 10% auto auto;
      width: 38%;
      height: 38%;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.48) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.48) 1px, transparent 1px);
      background-size: 18px 18px;
      opacity: 0.35;
    }

    .hero-card-circle {
      width: 110px;
      height: 110px;
      border-radius: 999px;
      filter: blur(0.2px);
      opacity: 0.9;
    }

    .hero-card-line {
      width: 120%;
      height: 2px;
      background: rgba(255, 255, 255, 0.45);
      transform: rotate(-16deg);
      left: -8%;
      top: 56%;
    }

    .hero-hover-pill {
      position: absolute;
      display: inline-flex;
      align-items: center;
      padding: 9px 15px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 14px 34px rgba(20, 26, 18, 0.08);
      color: #1d2430;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      left: 50%;
      top: -18px;
      transform: translate(-50%, 12px) scale(0.96);
      transition:
        opacity 0.22s ease,
        transform 0.22s ease;
      z-index: 12;
    }

    .hero-hover-pill::after {
      content: "";
      position: absolute;
      bottom: -7px;
      left: 50%;
      width: 14px;
      height: 14px;
      background: rgba(255, 255, 255, 0.98);
      margin-left: -7px;
      transform: rotate(45deg);
      border-radius: 3px;
      box-shadow: 6px 6px 16px rgba(20, 26, 18, 0.04);
    }

    .hero-card:hover .hero-hover-pill,
    .hero-card:focus-within .hero-hover-pill {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    .trust-section {
      position: relative;
      background: #ffffff;
      color: #142012;
      overflow: hidden;
    }

    .trust-section::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: #ffffff;
    }

    .trust-reveal {
      position: relative;
      z-index: 1;
      opacity: 0;
      transform: translateY(38px);
      filter: blur(10px);
      transition:
        opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.8s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .trust-reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }

    .trust-marquee {
      position: relative;
      overflow: hidden;
      margin-top: 4.5rem;
      mask-image: linear-gradient(90deg, transparent 0%, black 12%, black 88%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, black 12%, black 88%, transparent 100%);
    }

    .trust-track {
      display: flex;
      width: max-content;
      align-items: center;
      gap: 2.5rem;
      animation: marquee-slide 34s linear infinite;
    }

    .trust-logo {
      display: inline-flex;
      align-items: center;
      gap: 0.95rem;
      min-width: max-content;
      color: rgba(20, 32, 18, 0.28);
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      user-select: none;
      filter: grayscale(1);
    }

    .trust-logo-mark {
      position: relative;
      width: 2.25rem;
      height: 2.25rem;
      flex: 0 0 2.25rem;
      border-radius: 999px;
      border: 1px solid rgba(20, 32, 18, 0.14);
      background: rgba(20, 32, 18, 0.03);
    }

    .trust-logo-mark::before,
    .trust-logo-mark::after {
      content: "";
      position: absolute;
      background: rgba(20, 32, 18, 0.16);
    }

    .trust-logo-mark::before {
      width: 44%;
      height: 44%;
      border-radius: 999px;
      left: 18%;
      top: 18%;
    }

    .trust-logo-mark::after {
      width: 0.85rem;
      height: 2px;
      border-radius: 999px;
      right: 14%;
      bottom: 28%;
      transform: rotate(-34deg);
      transform-origin: right center;
    }

    .trust-logo--wordmark {
      font-size: 1.45rem;
      letter-spacing: 0.12em;
    }

    .trust-logo--round .trust-logo-mark::before {
      left: 50%;
      top: 50%;
      width: 0.9rem;
      height: 0.9rem;
      transform: translate(-50%, -50%);
    }

    .trust-logo--round .trust-logo-mark::after {
      display: none;
    }

    .trust-logo--stack .trust-logo-mark::before {
      width: 0.95rem;
      height: 0.95rem;
      border-radius: 0.3rem;
      left: 0.42rem;
      top: 0.36rem;
      box-shadow: 0 0.4rem 0 0 rgba(20, 32, 18, 0.12);
    }

    .trust-logo--stack .trust-logo-mark::after {
      display: none;
    }

    .gallery-section {
      position: relative;
      background: #ffffff;
      color: #142012;
      overflow: hidden;
    }

    .gallery-wave {
      position: relative;
      overflow-x: hidden;
      overflow-y: visible;
      mask-image: linear-gradient(90deg, transparent 0%, black 12%, black 88%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, black 12%, black 88%, transparent 100%);
    }

    .gallery-track {
      display: flex;
      width: max-content;
      align-items: center;
      gap: 1rem;
      will-change: transform;
      animation: gallery-scroll-left 46s linear infinite;
    }

    .gallery-track--reverse {
      animation-name: gallery-scroll-right;
      animation-duration: 50s;
    }

    .gallery-mini-card {
      position: relative;
      width: 4.7rem;
      height: 4.7rem;
      flex: 0 0 4.7rem;
      overflow: hidden;
      border: 0;
      border-radius: 1.15rem;
      box-shadow: none;
      appearance: none;
      -webkit-appearance: none;
      transform: translateY(calc(var(--wave-offset, 0) * 1px));
      animation: gallery-wave 6.8s ease-in-out infinite;
      animation-delay: var(--wave-delay, 0s);
    }

    .gallery-mini-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(155deg, rgba(255, 255, 255, 0.52), transparent 30%),
        radial-gradient(circle at 78% 18%, rgba(255, 255, 255, 0.24), transparent 18%);
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .gallery-mini-card-grid,
    .gallery-mini-card-line,
    .gallery-mini-card-circle {
      position: absolute;
      pointer-events: none;
    }

    .gallery-mini-card-grid {
      top: 0.6rem;
      right: 0.55rem;
      width: 42%;
      height: 42%;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.45) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.45) 1px, transparent 1px);
      background-size: 0.5rem 0.5rem;
      opacity: 0.34;
    }

    .gallery-mini-card-line {
      width: 132%;
      height: 2px;
      top: 57%;
      left: -10%;
      background: rgba(255, 255, 255, 0.4);
      transform: rotate(-17deg);
    }

    .gallery-mini-card-circle {
      width: 2.3rem;
      height: 2.3rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.42);
      top: 0.75rem;
      left: 0.7rem;
    }

    .gallery-mini-card-label {
      position: absolute;
      left: 0.7rem;
      right: 0.7rem;
      bottom: 0.55rem;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.92);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .gallery-mini-card-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @keyframes gallery-scroll-left {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(calc(-33.333% - 0.666rem));
      }
    }

    @keyframes gallery-scroll-right {
      from {
        transform: translateX(calc(-33.333% - 0.666rem));
      }
      to {
        transform: translateX(0);
      }
    }

    @keyframes gallery-wave {
      0%,
      100% {
        transform: translateY(calc(var(--wave-offset, 0) * 1px));
      }
      50% {
        transform: translateY(calc((var(--wave-offset, 0) - 10) * 1px));
      }
    }

    @keyframes marquee-slide {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(calc(-50% - 1.25rem));
      }
    }

    @keyframes stage-sheen {
      0%,
      100% {
        transform: translateX(-120%);
      }
      40%,
      60% {
        transform: translateX(120%);
      }
    }

    @keyframes copy-rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes lead-card-rise {
      0% {
        opacity: 0;
        transform: translate(-50%, 260px) scale(0.86) rotate(6deg);
      }
      62% {
        opacity: 1;
        transform: translate(112px, -18px) scale(1.08) rotate(7deg);
      }
      100% {
        opacity: 1;
        transform: translate(var(--card-x, -50%), var(--card-y, 0)) scale(1) rotate(var(--card-rotate, 0deg));
      }
    }

    @keyframes fan-card-left-a {
      0% {
        opacity: 0;
        transform: translate(112px, -6px) scale(0.96) rotate(6deg);
      }
      18% {
        opacity: 1;
        transform: translate(104px, -10px) scale(0.98) rotate(5deg);
      }
      54% {
        opacity: 1;
        transform: translate(-210px, 12px) scale(1.01) rotate(-11deg);
      }
      100% {
        opacity: 1;
        transform: translate(var(--card-x), var(--card-y)) scale(1) rotate(var(--card-rotate));
      }
    }

    @keyframes fan-card-left-b {
      0% {
        opacity: 0;
        transform: translate(112px, -6px) scale(0.96) rotate(6deg);
      }
      18% {
        opacity: 1;
        transform: translate(100px, -10px) scale(0.98) rotate(5deg);
      }
      56% {
        opacity: 1;
        transform: translate(-108px, 6px) scale(1.01) rotate(-5deg);
      }
      100% {
        opacity: 1;
        transform: translate(var(--card-x), var(--card-y)) scale(1) rotate(var(--card-rotate));
      }
    }

    @keyframes fan-card-left-c {
      0% {
        opacity: 0;
        transform: translate(112px, -6px) scale(0.96) rotate(6deg);
      }
      18% {
        opacity: 1;
        transform: translate(96px, -10px) scale(0.98) rotate(5deg);
      }
      58% {
        opacity: 1;
        transform: translate(-2px, 2px) scale(1.01) rotate(-1deg);
      }
      100% {
        opacity: 1;
        transform: translate(var(--card-x), var(--card-y)) scale(1) rotate(var(--card-rotate));
      }
    }

    @keyframes fan-card-left-d {
      0% {
        opacity: 0;
        transform: translate(112px, -6px) scale(0.96) rotate(6deg);
      }
      18% {
        opacity: 1;
        transform: translate(92px, -10px) scale(0.98) rotate(5deg);
      }
      60% {
        opacity: 1;
        transform: translate(92px, 5px) scale(1.01) rotate(2deg);
      }
      100% {
        opacity: 1;
        transform: translate(var(--card-x), var(--card-y)) scale(1) rotate(var(--card-rotate));
      }
    }

    @keyframes pill-rise {
      0% {
        opacity: 0;
        transform: translateY(22px) scale(0.82) rotate(var(--pill-rotate, 0deg));
      }
      70% {
        opacity: 1;
        transform: translateY(-4px) scale(1.03) rotate(var(--pill-rotate, 0deg));
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(var(--pill-rotate, 0deg));
      }
    }

    @media (max-width: 900px) {
      .saas-stage {
        min-height: 780px;
      }

      .hero-card {
        width: 142px;
        top: 50%;
      }

    }

    @media (max-width: 640px) {
      .saas-stage {
        width: calc(100vw - 22px);
        min-height: 720px;
        margin: 0 auto;
      }

      .hero-card {
        width: 116px;
        top: 51%;
      }

      .hero-hover-pill {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const services = [

    function TwillfulSite() {
      const [formStatus, setFormStatus] = React.useState({ state: "idle", message: "" });
      const CONTACT_RELAY_URL = "https://twillful-contact-relay.chwalik.workers.dev/contact";
      const trustRef = React.useRef(null);

      React.useEffect(() => {
        const node = trustRef.current;
        if (!node) return;

        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              node.classList.add("is-visible");
              observer.disconnect();
            }
          },
          { threshold: 0.22 }
        );

        observer.observe(node);
        return () => observer.disconnect();
      }, []);

      async function handleContactSubmit(event) {
        event.preventDefault();
        const form = event.currentTarget;
        const formData = new FormData(form);
        const name = String(formData.get("name") || "").trim();
        const company = String(formData.get("company") || "").trim();
        const website = String(formData.get("website") || "").trim();
        const phone = String(formData.get("phone") || "").trim();

        if (!name || !company || !phone) {
          setFormStatus({ state: "error", message: "Please add your name, business name, and phone number." });
          return;
        }

        setFormStatus({ state: "loading", message: "Sending..." });

        try {
          if (CONTACT_RELAY_URL.includes("REPLACE_WITH_YOUR_WORKER_URL")) {
            throw new Error("Relay URL not configured");
          }

          const response = await fetch(CONTACT_RELAY_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name,
              company,
              website,
              phone
            })
          });

          if (!response.ok) {
            throw new Error("Webhook request failed");
          }

          form.reset();
          setFormStatus({ state: "success", message: "Inquiry sent. We will follow up soon." });
        } catch (error) {
          setFormStatus({ state: "error", message: "Submission failed. Please try again." });
        }
      }

                    <div className="md:col-span-2 flex flex-wrap items-center gap-5 pt-2">

                      {formStatus.message && (

                            formStatus.state === "error" ? "text-[#a34848]" : "text-[#5a6855]"
                          }`}

                    </div>
